name: Extract SF Symbols PKG

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xar cpio

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Extract DMG with 7zip
        run: |
          mkdir dmg
          7z x symbols.dmg -odmg

      - name: Find and extract PKG
        run: |
          PKG=$(find dmg -name "*.pkg" | head -n 1)
          echo "Found PKG: $PKG"
          mkdir pkg
          xar -xf "$PKG" -C pkg

      - name: Extract Payload
        run: |
          mkdir payload
          cd payload
          cat ../pkg/Payload | cpio -idmv

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-extracted
          path: payload
