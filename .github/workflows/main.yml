name: Extract SF Symbols DMG (7zip)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Extract DMG with 7zip
        run: |
          mkdir extracted
          7z x symbols.dmg -oextracted

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-extracted
          path: extracted
