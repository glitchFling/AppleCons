name: Extract SF Symbols PKG (auto)

on:
  push:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Extract DMG
        run: |
          mkdir dmg
          7z x symbols.dmg -odmg

      - name: Extract ALL PKGs recursively
        run: |
          mkdir pkgs
          find dmg -name "*.pkg" | while read PKG; do
            echo "Extracting $PKG"
            OUT="pkgs/$(basename "$PKG")"
            mkdir "$OUT"
            7z x "$PKG" -o"$OUT"
          done

      - name: Find real Payload
        run: |
          mkdir payload
          REAL_PAYLOAD=$(find pkgs -name "Payload" | head -n 1)
          echo "Found Payload: $REAL_PAYLOAD"
          7z x "$REAL_PAYLOAD" -opayload

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-extracted
          path: payload
