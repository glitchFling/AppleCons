name: Export SF Symbols using sfsymbols

on:
  push:

jobs:
  export:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Mount DMG
        run: hdiutil attach symbols.dmg -mountpoint /Volumes/SFSymbols

      - name: Install SF Symbols
        run: sudo installer -pkg "$(find /Volumes/SFSymbols -name '*.pkg')" -target /

      - name: Unmount DMG
        run: hdiutil detach /Volumes/SFSymbols

      - name: Export all symbols using sfsymbols
        run: |
          mkdir exports
          "/Applications/SF Symbols.app/Contents/MacOS/sfsymbols" export --all --output exports

      - name: Upload exported symbols
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-svg
          path: exports
