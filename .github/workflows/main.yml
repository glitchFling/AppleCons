name: Extract SF Symbols 27

on:
  push:

jobs:
  extract:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Mount DMG
        run: hdiutil attach symbols.dmg -mountpoint /Volumes/SFSymbols

      - name: List DMG contents
        run: ls -R /Volumes/SFSymbols

      - name: Find PKG
        run: |
          PKG=$(find /Volumes/SFSymbols -name "*.pkg" | head -n 1)
          echo "Found PKG: $PKG"
          echo "$PKG" > pkgpath.txt

      - name: Extract PKG
        run: |
          PKG=$(cat pkgpath.txt)
          mkdir extracted
          pkgutil --expand "$PKG" extracted/pkg

      - name: Extract Payload
        run: |
          mkdir extracted/app
          cd extracted/app
          cat ../pkg/Payload | cpio -idmv

      - name: Unmount DMG
        run: hdiutil detach /Volumes/SFSymbols

      - name: Upload extracted app
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-app
          path: extracted/app
