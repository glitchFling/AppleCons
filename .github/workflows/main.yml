name: Extract SF Symbols 27

on:
  push:

jobs:
  extract:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Mount DMG
        run: |
          hdiutil attach symbols.dmg -mountpoint /Volumes/SFSymbols

      - name: Copy .app from DMG
        run: |
          mkdir extracted
          cp -R "/Volumes/SFSymbols/SF Symbols.app" extracted/

      - name: Unmount DMG
        run: hdiutil detach /Volumes/SFSymbols

      - name: Upload extracted app
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-app
          path: extracted
