name: Extract SF Symbols DMG (correct)

on:
  push:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download SF Symbols DMG
        run: curl -L "https://devimages-cdn.apple.com/design/resources/download/SF-Symbols-27.dmg" -o symbols.dmg

      - name: Extract DMG
        run: |
          mkdir dmg
          7z x symbols.dmg -odmg

      - name: Extract the .app bundle
        run: |
          mkdir app
          find dmg -name "*.app" -exec cp -R {} app/ \;

      - name: Upload extracted app
        uses: actions/upload-artifact@v4
        with:
          name: sf-symbols-app
          path: app
